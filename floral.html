<style>
/* =====================================================================================
   1. THEME — colours and fonts. Swap these to restyle the whole page.
   (You can also override them from weddingConfig.theme without touching CSS.)
   ===================================================================================== */
:root {
  /* FLORAL THEME — dusty rose and sage. Variable names are kept from the classic template,
     so "--gold" is the accent colour (here a dusty rose-brown) and weddingConfig.theme still works. */
  --ivory:      #fbf6f2;   /* page background */
  --cream:      #f6ebe6;   /* alternate section background */
  --paper:      #fffcfa;   /* cards */
  --gold:       #9a6a5e;   /* accents, lines, buttons (dark enough for small text) */
  --gold-soft:  #e6cfc6;   /* soft borders */
  --charcoal:   #3d3433;   /* main text */
  --muted:      #756663;   /* secondary text */
  --blush:      #f4e0da;   /* soft highlight */
  --blush-deep: #c98b84;   /* stronger highlight */
  --overlay:    rgba(52, 36, 34, 0.46); /* darkening over a cover photo, if one is set */
  --cover-bg:   #fbf3ef;   /* cover colour (illustrated cover, no photo) */

  /* Flower illustration colours */
  --petal-light: #f8dcd6;  /* outer petals */
  --petal:       #eab3ab;  /* middle petals */
  --petal-deep:  #d38c86;  /* inner petals and buds */
  --petal-line:  rgba(160, 92, 86, .38); /* petal outlines */
  --sage-light:  #c9d6c1;  /* pale leaves */
  --sage:        #93a98c;  /* leaves and stems */
  --sage-deep:   #5a7258;  /* dark leaves, footer background */
  --pollen:      #d9b77c;  /* flower centres */

  --serif:  "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --sans:   "Lato", "Helvetica Neue", Arial, sans-serif;
  --script: "Great Vibes", "Cormorant Garamond", cursive;

  --radius: 999px;          /* pill-shaped buttons and inputs */
  --ease: cubic-bezier(.22, .61, .36, 1);
}

/* =====================================================================================
   2. BASE
   ===================================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ivory);
  color: var(--charcoal);
  font-family: var(--sans);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.locked { overflow: hidden; height: 100vh; height: 100dvh; } /* no scrolling until "Buka" */
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shared typography */
.eyebrow {                      /* small-caps section label */
  font-family: var(--sans);
  font-size: .72rem;
  font-weight: 400;
  letter-spacing: .38em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 .6rem;
}
.title {                        /* large letter-spaced heading */
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(2rem, 7vw, 2.9rem);
  letter-spacing: .04em;
  line-height: 1.15;
  margin: 0 0 1.4rem;
}
.amp {                          /* the italic ampersand */
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
  color: var(--gold);
}

/* Layout */
.section { padding: 5.5rem 1.5rem; text-align: center; position: relative; }
.section.alt { background: var(--cream); }
.wrap { max-width: 640px; margin: 0 auto; }

/* Thin gold rule + SVG ornament between sections */
.ornament { display: flex; justify-content: center; color: var(--gold); padding: 0 1.5rem; }
.ornament svg { width: min(260px, 70vw); height: auto; opacity: .85; }
.rule { width: 48px; height: 1px; background: var(--gold); margin: 1.6rem auto; border: 0; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  min-height: 46px; padding: .7rem 1.6rem;
  border: 1px solid var(--gold); border-radius: var(--radius);
  background: transparent; color: var(--charcoal);
  font-family: var(--sans); font-size: .74rem; font-weight: 400;
  letter-spacing: .26em; text-transform: uppercase; text-decoration: none;
  cursor: pointer; transition: background .35s var(--ease), color .35s var(--ease);
}
.btn:hover, .btn:focus-visible { background: var(--gold); color: var(--paper); }
.btn.solid { background: var(--gold); color: var(--paper); }
.btn.solid:hover, .btn.solid:focus-visible { background: var(--charcoal); border-color: var(--charcoal); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 1.6rem; }
.btn-row .btn { flex: 1 1 210px; max-width: 300px; } /* equal-width buttons that wrap neatly on phones */
:focus-visible { outline: 2px solid var(--blush-deep); outline-offset: 3px; }

/* Fade-in on scroll (toggled by IntersectionObserver) */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 1.1s var(--ease), transform 1.1s var(--ease); }
.reveal.visible { opacity: 1; transform: none; }

/* =====================================================================================
   3. COVER / LOCK SCREEN
   ===================================================================================== */
#cover {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  color: var(--charcoal); text-align: center; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, var(--paper) 0%, rgba(255,252,250,0) 62%),
    radial-gradient(ellipse at 0% 0%, var(--blush) 0%, rgba(244,224,218,0) 45%),
    radial-gradient(ellipse at 100% 100%, var(--blush) 0%, rgba(244,224,218,0) 45%),
    var(--cover-bg);
  transition: opacity 1.1s var(--ease), transform 1.3s var(--ease);
}
#cover.opened { opacity: 0; transform: translateY(-6%); pointer-events: none; }
#cover.gone { display: none; }
.cover-bg {
  position: absolute; inset: -4%;
  background-size: cover; background-position: center;
  animation: slowZoom 22s ease-in-out infinite alternate; /* subtle zoom on the hero */
}
@keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.09); } }
.cover-overlay {
  position: absolute; inset: 0; display: none; /* only used when a cover photo is set */
  background: linear-gradient(180deg, rgba(0,0,0,.18) 0%, var(--overlay) 55%, rgba(20,16,14,.68) 100%);
}
.cover-frame {                  /* double hairline frame inset from the edges */
  position: absolute; inset: 14px; border: 1px solid var(--gold-soft); pointer-events: none;
  outline: 1px solid var(--gold-soft); outline-offset: -7px;
}
.cover-content { position: relative; z-index: 2; padding: 2rem 1.75rem; max-width: 560px; animation: rise 1.6s var(--ease) both .2s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.cover-title { font-size: .74rem; letter-spacing: .45em; text-transform: uppercase; margin: 0 0 1.4rem; color: var(--gold); }
.cover-names {
  font-family: var(--script); font-weight: 400; color: var(--gold);
  font-size: clamp(3.4rem, 17vw, 6.2rem); line-height: 1.05; margin: 0; overflow-wrap: anywhere;
}
.cover-names .amp { display: block; font-family: var(--serif); font-size: .42em; color: var(--blush-deep); margin: .1em 0 .2em; }
.cover-date { margin: 2rem 0 .3rem; font-size: .82rem; letter-spacing: .32em; text-transform: uppercase; }
.cover-venue { margin: 0 0 2.4rem; font-family: var(--serif); font-style: italic; font-size: 1.2rem; opacity: .9; }
#openBtn { color: var(--paper); background: var(--gold); border-color: var(--gold); min-width: 150px; box-shadow: 0 6px 20px rgba(154, 106, 94, .25); }
#openBtn:hover, #openBtn:focus-visible { background: var(--sage-deep); border-color: var(--sage-deep); }

/* Cover with a photo: dark overlay and white text, as in the classic template */
#cover.has-photo { color: #fff; background: #4a3f3c; }
#cover.has-photo .cover-overlay { display: block; }
#cover.has-photo .cover-frame { border-color: rgba(255,255,255,.45); outline-color: rgba(255,255,255,.3); }
#cover.has-photo .cover-title, #cover.has-photo .cover-names, #cover.has-photo .cover-names .amp { color: #fff; }
#cover.has-photo .fl-corner { opacity: .9; }
.tap-hint { margin-top: 1rem; font-size: .7rem; letter-spacing: .14em; opacity: .7; }

/* =====================================================================================
   4. BANNER (parallax photo band at the top of the invitation)
   ===================================================================================== */
.banner { position: relative; height: 62vh; min-height: 360px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; text-align: center; }
.banner-bg { position: absolute; inset: -18% 0; background-size: cover; background-position: center; will-change: transform; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(60,30,30,.12), rgba(52,36,34,.55)); }
.banner-text { position: relative; z-index: 1; padding: 0 1.5rem; }
.monogram { font-family: var(--script); font-weight: 400; font-size: clamp(3rem, 13vw, 4.8rem); line-height: 1.1; margin: 0; }
.monogram .amp { font-family: var(--serif); font-size: .6em; color: var(--petal-light); padding: 0 .25em; }
.banner-date { margin: 1rem 0 0; font-size: .74rem; letter-spacing: .36em; text-transform: uppercase; }

/* =====================================================================================
   5. INVITATION
   ===================================================================================== */
.greeting { font-family: var(--serif); font-style: italic; font-size: 1.3rem; color: var(--muted); margin: 0 0 1.5rem; }
.lead { margin: 0 auto; max-width: 34em; color: var(--muted); }
.parents { display: grid; gap: 2rem; margin: 2rem 0; }
.parent-side h3 { margin: 0 0 .7rem; font-family: var(--sans); font-weight: 400; font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.parent-side p { margin: .15rem 0; font-family: var(--serif); font-size: 1.28rem; line-height: 1.35; }
.parent-side small { display: block; font-family: var(--sans); font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: .1rem; }
.couple-full { margin: 2.4rem 0; }
.couple-full p { margin: 0; font-family: var(--serif); font-size: clamp(1.7rem, 6.4vw, 2.4rem); line-height: 1.2; letter-spacing: .02em; }
.couple-full .amp { display: block; font-size: 2.2rem; margin: .35rem 0; color: var(--blush-deep); }
.closing { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--muted); margin: 0; }

@media (min-width: 640px) { .parents { grid-template-columns: 1fr 1fr; } }

/* =====================================================================================
   6. EVENT DETAILS
   ===================================================================================== */
.detail-card { background: var(--paper); border: 1px solid var(--gold-soft); border-radius: 180px 180px 14px 14px; /* arch */ padding: 4.2rem 1.6rem 2.4rem; position: relative; box-shadow: 0 10px 40px rgba(154, 106, 94, .08); }
.detail-card::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--blush); border-radius: 174px 174px 9px 9px; pointer-events: none; }
.detail-block + .detail-block { margin-top: 1.9rem; }
.detail-block h3 { margin: 0 0 .45rem; font-weight: 400; font-size: .7rem; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.detail-date { font-family: var(--serif); font-size: 1.55rem; margin: 0; line-height: 1.3; }
.venue-name { font-family: var(--serif); font-size: 1.45rem; margin: 0; line-height: 1.3; }
.venue-address { margin: .35rem auto 0; color: var(--muted); max-width: 26em; white-space: pre-line; }
.schedule { list-style: none; margin: .4rem auto 0; padding: 0; max-width: 380px; }
.schedule li { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem 0; border-bottom: 1px dashed var(--gold-soft); text-align: left; }
.schedule li:last-child { border-bottom: 0; }
.schedule .s-label { flex: 1 1 50%; font-family: var(--serif); font-size: 1.15rem; line-height: 1.35; }
.schedule .s-time { flex: 1 1 50%; color: var(--muted); font-size: .9rem; line-height: 1.5; text-align: right; padding-top: .15rem; }

/* =====================================================================================
   7. COUNTDOWN
   ===================================================================================== */
.countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; max-width: 460px; margin: 0 auto; perspective: 600px; }
.cd-box { background: var(--paper); border: 1px solid var(--gold-soft); border-radius: 999px 999px 10px 10px; /* small arches */ padding: 1.5rem .2rem .9rem; }
.cd-num { display: block; font-family: var(--serif); font-size: clamp(1.9rem, 8.5vw, 2.8rem); line-height: 1; font-variant-numeric: lining-nums tabular-nums; transform-origin: 50% 60%; }
.cd-num.flip { animation: flip .55s var(--ease); }
@keyframes flip { 0% { transform: rotateX(80deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.cd-label { display: block; margin-top: .55rem; font-size: .62rem; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.cd-done { font-family: var(--serif); font-style: italic; font-size: 1.6rem; color: var(--blush-deep); margin: 1.6rem 0 0; }

/* =====================================================================================
   8. WISHES
   ===================================================================================== */
.wish-list:empty { display: none; }
.wish-list { display: grid; gap: 1rem; margin: 2rem 0 0; text-align: left; max-height: 540px; overflow-y: auto; padding: .25rem; }
.wish-card { background: var(--paper); border-left: 3px solid var(--petal); border-radius: 0 12px 12px 0; padding: 1.1rem 1.25rem; box-shadow: 0 1px 0 var(--gold-soft); animation: rise .7s var(--ease) both; }
.wish-card p { margin: 0; font-family: var(--serif); font-size: 1.15rem; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
.wish-card .sender { margin-top: .6rem; font-family: var(--sans); font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }

/* Forms (wishes + RSVP) */
.form { display: grid; gap: 1rem; text-align: left; }
#wishForm { margin-top: 2.6rem; }
.field label, .field legend { display: block; margin-bottom: .35rem; font-size: .68rem; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field textarea {
  width: 100%; padding: .8rem 1.1rem; background: var(--paper);
  border: 1px solid var(--gold-soft); border-radius: 12px; font-size: 1rem; /* 16px stops iOS zoom */
  transition: border-color .3s;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
.field textarea { min-height: 110px; resize: vertical; }
fieldset.field { border: 0; padding: 0; margin: 0; }
.field .choice { display: flex; align-items: center; gap: .6rem; padding: .45rem 0; margin: 0; cursor: pointer;
  font-size: 1rem; letter-spacing: normal; text-transform: none; color: var(--charcoal); }
.choice input { accent-color: var(--gold); width: 18px; height: 18px; }
.form-note { font-size: .78rem; color: var(--muted); margin: 0; text-align: center; }
.msg { min-height: 1.5em; margin: .2rem 0 0; font-size: .92rem; text-align: center; }
.msg.ok { color: var(--sage-deep); }
.msg.err { color: #a2574b; }
button:disabled, input:disabled { opacity: .55; cursor: wait; }

/* =====================================================================================
   9. RSVP
   ===================================================================================== */
.code-row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; margin-top: 1.4rem; }
#rsvpCode {
  width: 11rem; text-align: center; letter-spacing: .6em; padding: .75rem .5rem .75rem 1.1rem;
  font-family: var(--serif); font-size: 1.5rem; background: var(--paper);
  border: 1px solid var(--gold-soft); border-radius: 12px;
}
#rsvpCode:focus { outline: none; border-color: var(--gold); }
#rsvpStep2 { margin-top: 2rem; }
[hidden] { display: none !important; }

/* =====================================================================================
   10. FOOTER + FLOATING CONTROLS
   ===================================================================================== */
footer { position: relative; overflow: hidden; padding: 4.5rem 1.5rem 6rem; text-align: center; background: var(--sage-deep); color: var(--cream); }
footer .monogram { font-size: 3rem; }
footer .fl-sprig { width: min(240px, 66vw); margin: 0 auto 1rem; display: block; }
footer .thanks { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 1.2rem 0 2rem; }
footer .credit { font-size: .68rem; letter-spacing: .24em; text-transform: uppercase; opacity: .55; margin: 0; }

.float-btn {
  position: fixed; z-index: 60; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: rgba(255, 253, 249, .88); border: 1px solid var(--gold-soft); color: var(--charcoal);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 4px 18px rgba(40, 30, 20, .12);
  font-size: .68rem; letter-spacing: .12em; font-weight: 700;
}
#langToggle { top: max(16px, env(safe-area-inset-top)); right: 16px; }
#musicToggle { bottom: max(18px, env(safe-area-inset-bottom)); right: 16px; }
#musicToggle svg { width: 18px; height: 18px; }
#musicToggle.playing svg { animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* =====================================================================================
   11. FLORAL DECORATION — corner sprays, divider sprigs and falling petals.
   The flowers are drawn once as SVG symbols (just after <body>) and reused with <use>,
   so their colours come from the --petal-* / --sage-* variables above.
   ===================================================================================== */
.section { overflow: hidden; }          /* keeps corner flowers inside their section */
.fl-corner {                            /* wrapper does the mirroring … */
  position: absolute; z-index: 1; width: min(44vw, 250px); aspect-ratio: 1; pointer-events: none;
}
.fl-corner svg {                        /* … the svg inside does the gentle sway */
  width: 100%; height: 100%; display: block; overflow: visible;
  transform-origin: 0 0; animation: sway 7s ease-in-out infinite alternate;
}
.fl-corner.tl { top: -8px;    left: -8px; }
.fl-corner.tr { top: -8px;    right: -8px;  transform: scaleX(-1); }
.fl-corner.bl { bottom: -8px; left: -8px;   transform: scaleY(-1); }
.fl-corner.br { bottom: -8px; right: -8px;  transform: scale(-1, -1); }
.fl-corner.tr svg, .fl-corner.bl svg { animation-delay: -3.5s; }
.fl-corner.small { width: min(30vw, 150px); opacity: .85; }
@keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.8deg); } }

.detail-card .fl-corner { width: min(30vw, 140px); }
.detail-card .fl-corner.tl { top: -12px; left: -22px; }
.detail-card .fl-corner.br { bottom: -30px; right: -26px; }
.detail-card .detail-block, .detail-card .btn-row { position: relative; z-index: 2; }

.ornament svg, .fl-sprig { overflow: visible; }

/* Falling petals: a few shapes drifting down the screen (decorative only, never clickable) */
.petals { position: fixed; inset: 0; z-index: 55; pointer-events: none; overflow: hidden; }
.petals i {
  position: absolute; top: -40px; left: var(--x); width: 14px; height: 11px;
  background: var(--petal); opacity: .75;
  border-radius: 80% 0 80% 0;            /* leaf/petal shape */
  animation: fall var(--dur) linear var(--delay) infinite, flutter 2.6s ease-in-out infinite alternate;
}
.petals i:nth-child(3n)   { background: var(--petal-light); width: 11px; height: 9px; }
.petals i:nth-child(4n+1) { background: var(--petal-deep); opacity: .55; }
@keyframes fall {
  0%   { transform: translate3d(0, -5vh, 0) rotate(0deg); }
  100% { transform: translate3d(var(--drift), 110vh, 0) rotate(540deg); }
}
@keyframes flutter { from { margin-left: -10px; } to { margin-left: 12px; } }
body:not(.locked) .petals i { opacity: .45; } /* quieter once the invitation is open */

@media (max-width: 380px) { .fl-corner { width: 40vw; } .fl-corner.small { width: 26vw; } }

@media (min-width: 900px) {
  .section { padding: 7rem 2rem; }
  .fl-corner { width: 300px; }
  .fl-corner.small { width: 190px; }
  .detail-card { padding: 3rem 3rem; }
}

/* Respect users who ask their phone for less motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .reveal { opacity: 1; transform: none; }
  .petals { display: none; }
}
</style>

        <div class="cd-box"><span class="cd-num" data-unit="hours">--</span><span class="cd-label" data-t="hours"></span></div>
        <div class="cd-box"><span class="cd-num" data-unit="minutes">--</span><span class="cd-label" data-t="minutes"></span></div>
        <div class="cd-box"><span class="cd-num" data-unit="seconds">--</span><span class="cd-label" data-t="seconds"></span></div>
      </div>
      <p class="cd-done" id="cdDone" data-t="countdownDone" hidden></p>
    </div>
  </section>

  <div class="ornament" data-ornament></div>

  <!-- Guest wishes -->
  <section class="section" id="wishes">
    <div class="wrap reveal">
      <p class="eyebrow" data-t="wishesEyebrow"></p>
      <h2 class="title" data-t="wishesTitle"></h2>
      <p class="lead" data-t="wishesIntro"></p>

      <div class="wish-list" id="wishList" aria-live="polite"></div>

      <form class="form" id="wishForm" novalidate>
        <div class="field">
          <label for="wishName" data-t="wishName"></label>
          <input type="text" id="wishName" maxlength="60" autocomplete="name">
        </div>
        <div class="field">
          <label for="wishText" data-t="wishMessage"></label>
          <textarea id="wishText" maxlength="400"></textarea>
        </div>
        <button class="btn solid" type="submit" data-t="wishSubmit"></button>
        <p class="msg" id="wishMsg" role="status"></p>
        <p class="form-note" data-t="wishLocalNote"></p>
      </form>
    </div>
  </section>

  <!-- RSVP -->
  <section class="section alt" id="rsvp">
    <span class="fl-corner tl small" aria-hidden="true"><svg viewBox="0 0 220 220"><use href="#fl-corner"/></svg></span>
    <div class="wrap reveal">
      <p class="eyebrow" data-t="rsvpEyebrow"></p>
      <h2 class="title" data-t="rsvpTitle"></h2>
      <p class="lead" id="rsvpIntro"></p>

      <!-- Step 1: invitation code -->
      <form id="rsvpStep1" novalidate>
        <div class="code-row">
          <label for="rsvpCode" class="sr-only" data-t="rsvpCodePlaceholder"></label>
          <input type="text" id="rsvpCode" inputmode="numeric" autocomplete="one-time-code">
          <button class="btn solid" type="submit" data-t="rsvpCodeButton"></button>
        </div>
        <p class="msg" id="codeMsg" role="status"></p>
      </form>

      <!-- Step 2a: reply form (sent to your Google Sheet when rsvpEndpoint is set) -->
      <form class="form" id="rsvpStep2" novalidate hidden>
        <div class="field">
          <label for="rsvpName" data-t="rsvpName"></label>
          <input type="text" id="rsvpName" maxlength="80" autocomplete="name">
        </div>
        <div class="field" id="phoneField">
          <label for="rsvpPhone" data-t="rsvpPhone"></label>
          <input type="text" id="rsvpPhone" maxlength="20" inputmode="tel" autocomplete="tel">
        </div>
        <fieldset class="field">
          <legend data-t="rsvpAttending"></legend>
          <label class="choice"><input type="radio" name="attending" value="yes" checked> <span data-t="rsvpYes"></span></label>
          <label class="choice"><input type="radio" name="attending" value="no"> <span data-t="rsvpNo"></span></label>
        </fieldset>
        <div class="field" id="guestField">
          <label for="rsvpGuests" data-t="rsvpGuests"></label>
          <input type="number" id="rsvpGuests" min="1" value="1" inputmode="numeric">
        </div>
        <button class="btn solid" type="submit" data-t="rsvpSubmit"></button>
        <p class="msg" id="rsvpMsg" role="status"></p>
      </form>

      <!-- Step 2b: link to an external form, e.g. Google Forms (shown when rsvpExternalUrl is set) -->
      <div class="btn-row" id="rsvpExternal" hidden>
        <a class="btn solid" id="rsvpExternalLink" target="_blank" rel="noopener" data-t="rsvpExternal"></a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <svg class="fl-sprig" viewBox="0 0 300 70" aria-hidden="true"><use href="#fl-sprig"/></svg>
    <p class="monogram"><span data-bind="bride.shortName"></span><span class="amp">&amp;</span><span data-bind="groom.shortName"></span></p>
    <p class="thanks" data-t="footerThanks"></p>
    <p class="credit" data-t="footerCredit"></p>
  </footer>
</main>

<!-- Background music (hidden automatically when backgroundMusic is empty) -->
<audio id="bgm" loop preload="none"></audio>
<button class="float-btn" id="musicToggle" type="button" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>
</button>

<script>
/* =====================================================================================
   APP LOGIC — you should not need to edit below this line.
   ===================================================================================== */
(function () {
  "use strict";
  var C = weddingConfig;

  /* ---------- Small helpers ---------- */
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var isSet = function (v) { return typeof v === "string" && v.trim() !== "" ; };
  var LOCALES = { ms: "ms-MY", en: "en-GB" };

  // localStorage can throw (private mode, blocked storage) — never let that break the page.
  var store = {
    get: function (k, fallback) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // Unique storage key per invitation, so two invitations on the same website don't share wishes.
  var slug = (C.bride.shortName + "-" + C.groom.shortName + "-" + String(C.date).slice(0, 10))
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  var KEY_WISHES = "wedding-wishes:" + slug;
  var KEY_LANG = "wedding-lang:" + slug;

  var languages = (C.languages && C.languages.length) ? C.languages : ["en"];
  var lang = store.get(KEY_LANG, null);
  if (languages.indexOf(lang) === -1) lang = languages.indexOf(C.defaultLanguage) > -1 ? C.defaultLanguage : languages[0];

  // tr(): resolve a value that may be a plain string or { ms: "...", en: "..." }
  function tr(v) {
    if (v == null) return "";
    if (typeof v === "string" || typeof v === "number") return String(v);
    return v[lang] != null ? String(v[lang]) : (v[languages[0]] != null ? String(v[languages[0]]) : String(Object.values(v)[0] || ""));
  }
  // t(): UI label from config.text for the active language, with {placeholders} filled in
  function t(key, vars) {
    var dict = (C.text && (C.text[lang] || C.text[languages[0]])) || {};
    var s = dict[key] != null ? String(dict[key]) : key;
    return s.replace(/\{(\w+)\}/g, function (m, name) { return vars && vars[name] != null ? vars[name] : m; });
  }
  function getPath(obj, path) { return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, obj); }

  /* ---------- Dates ---------- */
  var eventStart = new Date(C.date);
  var eventEnd = C.endDate ? new Date(C.endDate) : new Date(eventStart.getTime() + 5 * 3600e3);
  var validDate = !isNaN(eventStart.getTime());

  function dateParts() {
    var fmt = new Intl.DateTimeFormat(LOCALES[lang] || lang, {
      timeZone: C.timeZone || undefined, weekday: "long", day: "2-digit", month: "2-digit", year: "numeric"
    });
    var p = {};
    fmt.formatToParts(eventStart).forEach(function (x) { p[x.type] = x.value; });
    return p;
  }
  // Cover line, e.g. "SABTU | 20 | 03 | 2027" — or the manual override in config.displayDate
  function displayDate() {
    var manual = tr(C.displayDate);
    if (isSet(manual) || !validDate) return manual;
    var p = dateParts();
    return [p.weekday.toUpperCase(), p.day, p.month, p.year].join(" | ");
  }
  // Details line, e.g. "Sabtu, 20 Mac 2027"
  function longDate() {
    if (!validDate) return tr(C.displayDate);
    return new Intl.DateTimeFormat(LOCALES[lang] || lang, {
      timeZone: C.timeZone || undefined, weekday: "long", day: "numeric", month: "long", year: "numeric"
    }).format(eventStart);
  }

  /* ---------- Decorative SVG ornament (injected wherever data-ornament appears) ---------- */
  var ORNAMENT =
    '<svg viewBox="0 0 300 70" aria-hidden="true" focusable="false"><use href="#fl-sprig"/></svg>';
  $$("[data-ornament]").forEach(function (el) { el.innerHTML = ORNAMENT; el.classList.add("reveal"); });

  /* ---------- Theme overrides from config.theme, e.g. { "--gold": "#a88b54" } ---------- */
  if (C.theme) Object.keys(C.theme).forEach(function (k) { document.documentElement.style.setProperty(k, C.theme[k]); });

  /* ---------- Images ---------- */
  function setBg(el, url) { if (el && isSet(url)) el.style.backgroundImage = 'url("' + url.replace(/"/g, "%22") + '")'; }
  setBg($("#coverBg"), C.coverImage);
  if (isSet(C.coverImage)) $("#cover").classList.add("has-photo"); // floral cover switches to white-on-photo
  setBg($("#bannerBg"), C.bannerImage || C.coverImage);

  /* ---------- Render everything that depends on language ---------- */
  function render() {
    document.documentElement.lang = lang;

    // 1) Static labels: any element with data-t="key"
    $$("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });

    // 2) Bound values: any element with data-bind="path.in.config"
    $$("[data-bind]").forEach(function (el) {
      var path = el.getAttribute("data-bind");
      el.textContent = path === "displayDate" ? displayDate() : tr(getPath(C, path));
    });

    // 3) Parents with role labels
    [["#brideParents", C.bride], ["#groomParents", C.groom]].forEach(function (pair) {
      var box = $(pair[0]); box.textContent = "";
      var roles = [t("father"), t("mother")];
      (pair[1].parents || []).forEach(function (name, i) {
        if (!isSet(tr(name))) return;
        var p = document.createElement("p");
        p.textContent = tr(name);
        if (roles[i]) { var s = document.createElement("small"); s.textContent = roles[i]; p.appendChild(s); }
        box.appendChild(p);
      });
      box.parentElement.hidden = !box.children.length; // hide a side with no names
    });
    $(".parents").hidden = !$("#brideParents").children.length && !$("#groomParents").children.length;

    // 4) Long date + schedule
    $("#longDate").textContent = longDate();
    var ul = $("#schedule"); ul.textContent = "";
    (C.schedule || []).forEach(function (item) {
      var li = document.createElement("li");
      var a = document.createElement("span"); a.className = "s-label"; a.textContent = tr(item.label);
      var b = document.createElement("span"); b.className = "s-time"; b.textContent = tr(item.time);
      li.appendChild(a); li.appendChild(b); ul.appendChild(li);
    });

    // 5) RSVP intro + code field size
    var codeLen = parseInt(C.rsvpCodeLength, 10) || 0;
    $("#rsvpIntro").textContent = codeLen ? t("rsvpIntro", { n: codeLen }) : t("rsvpIntroNoCode");
    var code = $("#rsvpCode");
    // No maxlength attribute: it would cut a pasted "12-34" to "12-3" before the digits are cleaned.
    // The input handler strips non-digits and trims to the right length instead.
    code.placeholder = new Array(codeLen + 1).join("•");
    code.setAttribute("aria-label", t("rsvpCodePlaceholder"));
    $("#phoneField").hidden = C.rsvpAskPhone === false;

    // 6) Wishes, floating controls, page title
    renderWishes();
    var other = languages[(languages.indexOf(lang) + 1) % languages.length];
    var lt = $("#langToggle");
    lt.hidden = languages.length < 2;
    lt.textContent = (C.text[other] && C.text[other].langName) || other.toUpperCase();
    $("#musicToggle").setAttribute("aria-label", t("musicLabel"));
    document.title = tr(C.bride.shortName) + " & " + tr(C.groom.shortName) + " · " + t("eventTitle");
  }

  /* ---------- Links ---------- */
  function setLink(el, url) {
    if (isSet(url)) { el.href = url; el.hidden = false; } else { el.hidden = true; }
  }
  setLink($("#mapBtn"), C.venue.mapsUrl);
  setLink($("#wazeBtn"), C.venue.wazeUrl);

  /* ---------- Cover reveal ("Buka" / "Open") ---------- */
  var cover = $("#cover"), invite = $("#invite");
  $("#openBtn").addEventListener("click", function () {
    cover.classList.add("opened");
    document.body.classList.remove("locked");
    invite.removeAttribute("inert");
    window.scrollTo(0, 0);
    setTimeout(function () { cover.classList.add("gone"); }, 1300);
    startMusic(); // a tap is the browser's permission to start audio
  });

  /* ---------- Fade-in on scroll ---------- */
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
    }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
    $$(".reveal").forEach(function (el) { io.observe(el); });
  } else {
    $$(".reveal").forEach(function (el) { el.classList.add("visible"); });
  }

  /* ---------- Parallax on the banner photo ---------- */
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var bannerBg = $("#bannerBg"), ticking = false;
  function parallax() {
    var r = bannerBg.parentElement.getBoundingClientRect();
    if (r.bottom > 0 && r.top < window.innerHeight) bannerBg.style.transform = "translate3d(0," + (r.top * -0.22).toFixed(1) + "px,0)";
    ticking = false;
  }
  if (!reduceMotion) window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(parallax); } }, { passive: true });

  /* ---------- Countdown ---------- */
  var cdNums = {}; $$(".cd-num").forEach(function (el) { cdNums[el.getAttribute("data-unit")] = el; });
  var cdTimer;
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function tick() {
    if (!validDate) return;
    var diff = eventStart.getTime() - Date.now();
    if (diff <= 0) {
      ["days", "hours", "minutes", "seconds"].forEach(function (u) { cdNums[u].textContent = "00"; });
      $("#cdDone").hidden = false;
      clearInterval(cdTimer);
      return;
    }
    var s = Math.floor(diff / 1000);
    var vals = { days: Math.floor(s / 86400), hours: Math.floor(s % 86400 / 3600), minutes: Math.floor(s % 3600 / 60), seconds: s % 60 };
    Object.keys(vals).forEach(function (u) {
      var el = cdNums[u], txt = u === "days" ? String(vals[u]).padStart(2, "0") : pad(vals[u]);
      if (el.textContent !== txt) {
        el.textContent = txt;
        el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip"); // restart the flip animation
      }
    });
  }
  tick(); cdTimer = setInterval(tick, 1000);

  /* ---------- Add to Calendar (.ics download) ---------- */
  function icsDate(d) { return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); } // 20270320T030000Z (UTC)
  function icsEscape(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
  function icsFold(line) {   // RFC 5545: lines longer than 75 octets must be folded
    var out = [], bytes = new TextEncoder(), cur = "";
    Array.from(line).forEach(function (ch) {
      if (bytes.encode(cur + ch).length > (out.length ? 74 : 75)) { out.push(cur); cur = ""; }
      cur += ch;
    });
    out.push(cur);
    return out.join("\r\n ");
  }
  $("#calBtn").addEventListener("click", function () {
    if (!validDate) return;
    var names = { bride: tr(C.bride.shortName), groom: tr(C.groom.shortName) };
    var location = [tr(C.venue.name), tr(C.venue.address)].filter(isSet).join(", ").replace(/\s*\n\s*/g, ", ");
    var desc = (C.schedule || []).map(function (i) { return tr(i.label) + ": " + tr(i.time); }).join("\n");
    if (isSet(C.venue.mapsUrl) && C.venue.mapsUrl !== "#") desc += "\n" + C.venue.mapsUrl;
    var lines = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Digital Wedding Invitation//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:" + slug + "@wedding-invitation",
      "DTSTAMP:" + icsDate(new Date()),
      "DTSTART:" + icsDate(eventStart),
      "DTEND:" + icsDate(eventEnd),
      "SUMMARY:" + icsEscape(t("calendarSummary", names)),
      "LOCATION:" + icsEscape(location),
      "DESCRIPTION:" + icsEscape(desc),
      "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", "DESCRIPTION:" + icsEscape(t("calendarSummary", names)), "END:VALARM",
      "END:VEVENT", "END:VCALENDAR"
    ];
    var blob = new Blob([lines.map(icsFold).join("\r\n") + "\r\n"], { type: "text/calendar;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = slug + ".ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });

  /* ---------- Guest wishes (config wishes + wishes saved on this device) ---------- */
  function renderWishes() {
    var list = $("#wishList"); list.textContent = "";
    var all = store.get(KEY_WISHES, []).concat(C.wishes || []); // newest local wishes first
    all.forEach(function (w) {
      var card = document.createElement("article"); card.className = "wish-card";
      var p = document.createElement("p"); p.textContent = tr(w.text);
      var s = document.createElement("div"); s.className = "sender"; s.textContent = "— " + tr(w.sender);
      card.appendChild(p); card.appendChild(s); list.appendChild(card);
    });
  }
  $("#wishForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("#wishName").value.trim(), text = $("#wishText").value.trim(), msg = $("#wishMsg");
    if (!name || !text) { msg.className = "msg err"; msg.textContent = t("wishError"); return; }
    var saved = store.get(KEY_WISHES, []);
    saved.unshift({ text: text, sender: name, at: new Date().toISOString() });
    store.set(KEY_WISHES, saved.slice(0, 50));
    renderWishes();
    $("#wishList").scrollTop = 0;
    this.reset();
    msg.className = "msg ok"; msg.textContent = t("wishThanks");
  });

  /* ---------- RSVP ----------
     Three modes, chosen by the config:
       • rsvpEndpoint set    → replies are sent to your Google Sheet (Apps Script web app).
                               If the Sheet has a "Codes" tab, the code is checked THERE, not here.
       • rsvpExternalUrl set → guests are sent to an external form (e.g. Google Forms).
       • neither             → demo only: nothing is stored or sent anywhere.
     rsvpCodeLength = 0 removes the code step entirely. */
  var CODE_LEN = parseInt(C.rsvpCodeLength, 10) || 0;
  var ENDPOINT = isSet(C.rsvpEndpoint) ? C.rsvpEndpoint.trim() : "";
  var KEY_RSVP = "wedding-rsvp:" + slug;
  var codeInput = $("#rsvpCode"), guests = $("#rsvpGuests");
  var verifiedCode = "";
  guests.max = C.rsvpMaxGuests || 10;

  // Send a request to the Apps Script web app.
  // No custom headers on purpose: a plain-text body keeps this a "simple request", so the browser
  // does not send a CORS pre-flight (which Apps Script cannot answer). Apps Script still parses the JSON.
  function callEndpoint(payload) {
    return fetch(ENDPOINT, { method: "POST", body: JSON.stringify(payload), redirect: "follow" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function setMsg(el, kind, text) { el.className = "msg " + kind; el.textContent = text; }
  function busy(form, on) { $$("button, input", form).forEach(function (x) { x.disabled = on; }); }

  function showReplyStep() {
    if (isSet(C.rsvpExternalUrl)) {
      $("#rsvpExternalLink").href = C.rsvpExternalUrl;
      $("#rsvpExternal").hidden = false;
    } else {
      $("#rsvpStep2").hidden = false;
    }
  }

  // No code step → show the reply form straight away
  if (!CODE_LEN) { $("#rsvpStep1").hidden = true; showReplyStep(); }

  // A guest who already replied on this device sees a gentle reminder (they can still send an update)
  var previous = store.get(KEY_RSVP, null);
  if (previous && previous.name) setMsg($("#rsvpMsg"), "ok", t("rsvpAlready", { name: previous.name }));

  codeInput.addEventListener("input", function () { this.value = this.value.replace(/\D/g, "").slice(0, CODE_LEN); });

  $("#rsvpStep1").addEventListener("submit", function (e) {
    e.preventDefault();
    var form = this, msg = $("#codeMsg"), code = codeInput.value;
    if (!new RegExp("^\\d{" + CODE_LEN + "}$").test(code)) {
      setMsg(msg, "err", t("rsvpCodeError", { n: CODE_LEN })); codeInput.focus(); return;
    }
    if (!ENDPOINT) { verifiedCode = code; setMsg(msg, "ok", t("rsvpCodeOk")); showReplyStep(); return; }

    // Ask the Sheet whether this code exists (only enforced if the Sheet has a "Codes" tab)
    busy(form, true); setMsg(msg, "", t("rsvpChecking"));
    callEndpoint({ action: "check", code: code }).then(function (res) {
      busy(form, false);
      if (!res.ok) { setMsg(msg, "err", t(res.error === "invalid_code" ? "rsvpCodeInvalid" : "rsvpSendError")); return; }
      verifiedCode = code;
      if (res.maxGuests) guests.max = res.maxGuests;
      setMsg(msg, "ok", res.household ? t("rsvpHousehold", { household: res.household }) : t("rsvpCodeOk"));
      showReplyStep();
      $("#rsvpName").focus();
    }).catch(function () { busy(form, false); setMsg(msg, "err", t("rsvpSendError")); });
  });

  $$('input[name="attending"]').forEach(function (r) {
    r.addEventListener("change", function () { $("#guestField").hidden = this.value === "no" && this.checked; });
  });

  $("#rsvpStep2").addEventListener("submit", function (e) {
    e.preventDefault();
    var form = this, msg = $("#rsvpMsg");
    var name = $("#rsvpName").value.trim();
    var phone = $("#rsvpPhone").value.trim();
    if (!name) { setMsg(msg, "err", t("rsvpNameError")); $("#rsvpName").focus(); return; }
    if (C.rsvpAskPhone !== false && !/^\+?[\d\s-]{7,20}$/.test(phone)) { setMsg(msg, "err", t("rsvpPhoneError")); $("#rsvpPhone").focus(); return; }
    var yes = $('input[name="attending"]:checked').value === "yes";
    var n = parseInt(guests.value, 10) || 1;
    if (yes && (n < 1 || n > Number(guests.max))) { setMsg(msg, "err", t("rsvpTooMany", { max: guests.max })); guests.focus(); return; }

    var reply = { action: "submit", code: verifiedCode, name: name, phone: phone,
                  attending: yes ? "yes" : "no", guests: yes ? n : 0, lang: lang };
    var thanks = t(yes ? "rsvpThanksYes" : "rsvpThanksNo", { name: name });

    if (!ENDPOINT) {  // demo mode: nothing leaves the page
      setMsg(msg, "ok", thanks);
      console.info("RSVP demo mode — not sent anywhere (set rsvpEndpoint to collect replies):", reply);
      return;
    }
    busy(form, true); setMsg(msg, "", t("rsvpSending"));
    callEndpoint(reply).then(function (res) {
      busy(form, false);
      if (!res.ok) {
        var key = res.error === "invalid_code" ? "rsvpCodeInvalid" : res.error === "too_many_guests" ? "rsvpTooMany" : "rsvpSendError";
        setMsg(msg, "err", t(key, { max: res.maxGuests || guests.max })); return;
      }
      store.set(KEY_RSVP, { name: name, attending: reply.attending, at: new Date().toISOString() });
      setMsg(msg, "ok", thanks);
    }).catch(function () { busy(form, false); setMsg(msg, "err", t("rsvpSendError")); });
  });

  /* ---------- Background music ---------- */
  var audio = $("#bgm"), musicBtn = $("#musicToggle");
  var hasMusic = isSet(C.backgroundMusic) && C.backgroundMusic !== "#";
  if (hasMusic) { audio.src = C.backgroundMusic; musicBtn.hidden = false; }
  function startMusic() {
    if (!hasMusic) return;
    var p = audio.play(); if (p && p.catch) p.catch(function () {});
  }
  audio.addEventListener("play", function () { musicBtn.classList.add("playing"); musicBtn.setAttribute("aria-pressed", "true"); });
  audio.addEventListener("pause", function () { musicBtn.classList.remove("playing"); musicBtn.setAttribute("aria-pressed", "false"); });
  musicBtn.addEventListener("click", function () { audio.paused ? startMusic() : audio.pause(); });

  /* ---------- Language toggle ---------- */
  $("#langToggle").addEventListener("click", function () {
    lang = languages[(languages.indexOf(lang) + 1) % languages.length];
    store.set(KEY_LANG, lang);
    render();
  });

  render();
})();
</script>
</body>
</html>
